<!doctype html>
<html><head><meta charset="utf-8"><title>Attendify</title>
<script>
/* GitHub Pages has no server-side routing, so an unknown path (e.g. /admin
   typed without the trailing slash) lands here. Send /admin paths to the
   admin redirect stub, and anything else back to the app's folder. */
var p = location.pathname;
var m = p.match(/^(.*\/)admin(\/.*)?$/i);
location.replace(m ? (m[1] + "admin/") : p.replace(/\/[^/]*$/, "/"));
</script>
<meta http-equiv="refresh" content="0; url=.">
</head><body>Redirecting to <a href=".">Attendify</a>&hellip;</body></html>
